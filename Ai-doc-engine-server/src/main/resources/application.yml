# ==============================================================================
# Ai-Doc-Engine 主配置文件
# ==============================================================================
# 职责：所有环境共享的基础配置
# 层级：基础层（优先级最低，可被环境配置覆盖）
# 维护：修改共享配置项时，确保不影响环境特定配置
# ==============================================================================

spring:
  application:
    name: ai-doc-engine-server
  
  profiles:
    active: dev

  # ==================== 数据源配置（基础模板）====================
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_doc_engine}?currentSchema=public
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1200000

  # ==================== JPA 配置 ====================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # ==================== 邮件配置 ====================
  mail:
    host: ${SPRING_MAIL_HOST:smtp.qq.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: true

  # ==================== Thymeleaf 模板配置 ====================
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

# ==================== 服务器配置 ====================
server:
  port: 8687
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ==================== JWT 配置 ====================
jwt:
  secret: ${JWT_SECRET:ai-doc-engine-jwt-secret-key-change-in-production-2024-must-be-at-least-256-bits}
  expiration: 7200000
  header: Authorization
  prefix: Bearer

# ==================== OAuth 统一登录配置 ====================
oauth:
  client-id: ${OAUTH_CLIENT_ID:}
  client-secret: ${OAUTH_CLIENT_SECRET:}
  redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:8687/oauth/callback}
  auth-host: ${OAUTH_AUTH_HOST:}
  request-timeout-millis: ${OAUTH_REQUEST_TIMEOUT_MILLIS:10000}

# ==================== 应用业务配置 ====================
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3514}

  file:
    upload-dir: ${APP_FILE_UPLOAD_DIR:../uploads}
    url-prefix: /uploads
    feedback-dir: feedback
    max-size: 10485760
    image-max-size: 5242880
    allowed-extensions: jpg,jpeg,png,gif,webp
    max-image-count: 5

  ocr:
    provider: custom
    api-url: ${APP_OCR_API_URL:http://127.0.0.1:5000/parse}
    timeout: 3000000

  password-reset:
    token:
      expire-hours: 24

  formula:
    mathjax:
      script-path: ${APP_FORMULA_MATHJAX_SCRIPT_PATH:mathjax-to-mathml.js}
      node-command: ${APP_FORMULA_MATHJAX_NODE_COMMAND:node}

  mermaid:
    command: ${APP_MERMAID_COMMAND:mmdc.cmd}
    timeout: 30
    background: transparent
    theme: default

# ==================== 日志配置 ====================
logging:
  level:
    root: WARN
    com.aidoc.engine: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ai-doc-engine.log
    max-size: 10MB
    max-history: 30

# ==================== 管理端点配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
