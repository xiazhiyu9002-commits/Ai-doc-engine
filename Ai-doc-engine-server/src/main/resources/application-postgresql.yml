# ==============================================================================
# Ai-Doc-Engine PostgreSQL 专用配置
# ==============================================================================
# 职责：PostgreSQL 数据库专用配置，可作为组合 profile 使用
# 层级：功能层（优先级最高）
# 使用：SPRING_PROFILES_ACTIVE=dev,postgresql 或 prod,postgresql
# ==============================================================================

spring:
  # ==================== PostgreSQL 数据源配置 ====================
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_doc_engine}?currentSchema=public
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1200000

  # ==================== JPA PostgreSQL 方言配置 ====================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true
        jdbc:
          batch_size: 50
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
        temp:
          use_jdbc_metadata_defaults: false

  # ==================== Flyway 迁移配置 ====================
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration/postgresql
    table: flyway_schema_history

  # ==================== SQL 初始化配置 ====================
  sql:
    init:
      mode: never

# ==================== PostgreSQL 日志配置 ====================
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.postgresql: DEBUG
