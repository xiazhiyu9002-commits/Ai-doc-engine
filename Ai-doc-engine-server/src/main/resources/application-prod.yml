# ===== 生产环境配置 =====
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_doc_engine?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      minimum-idle: 20
      maximum-pool-size: 80
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20

  mail:
    host: ${SPRING_MAIL_HOST:smtp.qq.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: true

# ===== Tomcat 高并发优化 =====
server:
  port: 8687
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 200
    max-connections: 10000
    connection-timeout: 60000
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ===== JWT 配置 =====
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000
  header: Authorization
  prefix: Bearer

# ===== OAuth 统一登录 =====
oauth:
  client-id: ${OAUTH_CLIENT_ID:}
  client-secret: ${OAUTH_CLIENT_SECRET:}
  redirect-uri: ${OAUTH_REDIRECT_URI:}
  auth-host: ${OAUTH_AUTH_HOST:}
  request-timeout-millis: ${OAUTH_REQUEST_TIMEOUT_MILLIS:10000}

# ===== 应用配置 =====
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost}

  file:
    upload-dir: /app/uploads
    export-dir: /app/exports
    max-size: 52428800
    allowed-extensions: jpg,jpeg,png,gif

  ocr:
    provider: custom
    api-url: http://127.0.0.1:5000/parse
    timeout: 3000000

  password-reset:
    token:
      expire-hours: 24

  formula:
    mathjax:
      script-path: ${APP_FORMULA_MATHJAX_SCRIPT_PATH:mathjax-to-mathml.js}
      node-command: ${APP_FORMULA_MATHJAX_NODE_COMMAND:node}

  mermaid:
    command: ${APP_MERMAID_COMMAND:mmdc}
    timeout: 30
    background: transparent
    theme: default

# ===== 日志配置 =====
logging:
  level:
    root: WARN
    com.aidoc.engine: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /app/logs/ai-doc-engine.log
    max-size: 10MB
    max-history: 30

# ===== 健康检查端点 =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
