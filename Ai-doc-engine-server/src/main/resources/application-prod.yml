# ==============================================================================
# Ai-Doc-Engine 生产环境配置
# ==============================================================================
# 职责：生产环境特定配置，覆盖主配置
# 层级：环境层（优先级高于主配置）
# 维护：生产环境敏感配置必须通过环境变量注入，不设置默认值
# 安全：部署前必须检查所有环境变量是否正确设置
# ==============================================================================

# ==================== 数据源配置（生产环境）====================
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_doc_engine}?currentSchema=public
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      minimum-idle: ${HIKARI_MIN_IDLE:20}
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:80}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # ==================== JPA 生产配置 ====================
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20

  # ==================== 邮件配置（生产环境）====================
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}

  # ==================== Thymeleaf 生产配置 ====================
  thymeleaf:
    cache: true

# ==================== Tomcat 高并发优化 ====================
server:
  port: 8687
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 200
    max-connections: 10000
    connection-timeout: 60000

# ==================== JWT 配置（生产环境）====================
jwt:
  secret: ${JWT_SECRET}
  expiration: 7200000
  header: Authorization
  prefix: Bearer

# ==================== OAuth 配置（生产环境）====================
oauth:
  client-id: ${OAUTH_CLIENT_ID}
  client-secret: ${OAUTH_CLIENT_SECRET}
  redirect-uri: ${OAUTH_REDIRECT_URI}
  auth-host: ${OAUTH_AUTH_HOST}
  request-timeout-millis: ${OAUTH_REQUEST_TIMEOUT_MILLIS:10000}

# ==================== 应用配置（生产环境）====================
app:
  frontend-url: ${APP_FRONTEND_URL}

  file:
    upload-dir: ${APP_FILE_UPLOAD_DIR:/app/uploads}
    export-dir: ${APP_FILE_EXPORT_DIR:/app/exports}
    max-size: 52428800
    allowed-extensions: jpg,jpeg,png,gif

  ocr:
    provider: custom
    api-url: ${APP_OCR_API_URL:http://127.0.0.1:5000/parse}
    timeout: 3000000

  password-reset:
    token:
      expire-hours: 24

  formula:
    mathjax:
      script-path: ${APP_FORMULA_MATHJAX_SCRIPT_PATH:mathjax-to-mathml.js}
      node-command: ${APP_FORMULA_MATHJAX_NODE_COMMAND:node}

  mermaid:
    command: ${APP_MERMAID_COMMAND:mmdc}
    timeout: 30
    background: transparent
    theme: default

# ==================== 日志配置（生产环境）====================
logging:
  level:
    root: WARN
    com.aidoc.engine: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${APP_LOG_PATH:/app/logs}/ai-doc-engine.log
    max-size: 10MB
    max-history: 30

# ==================== 健康检查端点 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
