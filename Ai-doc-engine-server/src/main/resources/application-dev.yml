  datasource:
    url: jdbc:postgresql://localhost:5432/ai_doc_engine?currentSchema=public
    username: postgres
    password: 123456

  # ==================== JPA 开发配置 ====================
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ==================== 邮件配置（开发环境）====================
